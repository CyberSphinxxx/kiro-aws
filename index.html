<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiro To-Do • Spec-Driven App</title>
  <meta name="description" content="A simple, fast, persistent To-Do application built with vanilla HTML, CSS, and JavaScript.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <main class="todo-card" id="app">
      <!-- Header -->
      <header class="app-header">
        <div class="header-badge">
          <span class="badge-dot"></span>
          <span>Spec-Driven Development</span>
        </div>
        <h1 class="app-title">Task Master</h1>
        <p class="app-subtitle">Organize your daily priorities with speed and focus.</p>
      </header>

      <!-- Input Form -->
      <form id="todo-form" class="todo-form" autocomplete="off">
        <div class="input-group">
          <input 
            type="text" 
            id="todo-input" 
            class="todo-input" 
            placeholder="What needs to be done?" 
            aria-label="New task description"
            maxlength="200"
            autofocus
            required
          >
          <button type="submit" id="add-btn" class="btn btn-primary" aria-label="Add task">
            <svg class="icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
              <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            <span>Add</span>
          </button>
        </div>
      </form>

      <!-- Filter / Status Bar -->
      <section class="toolbar" aria-label="Task filters and statistics">
        <div class="stats-text" id="stats-counter" aria-live="polite">
          0 items left
        </div>
        <div class="filter-group" role="tablist" aria-label="Filter tasks">
          <button type="button" class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
          <button type="button" class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
          <button type="button" class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
        </div>
      </section>

      <!-- To-Do List -->
      <section class="list-section">
        <ul id="todo-list" class="todo-list" role="list" aria-label="To-do items">
          <!-- Dynamically populated via app.js -->
        </ul>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" hidden>
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="40" height="40">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <p class="empty-title">All caught up!</p>
          <p class="empty-desc">No tasks in this view. Add one above to get started.</p>
        </div>
      </section>

      <!-- Footer -->
      <footer class="app-footer">
        <span>Click an item to toggle completion</span>
        <button type="button" id="clear-completed-btn" class="clear-btn" style="display: none;">Clear Completed</button>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
