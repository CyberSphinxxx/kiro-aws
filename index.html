<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster</title>
  <meta name="description" content="A simple, fast, persistent to-do application.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="brand-name">TaskMaster</span>
      </div>

      <nav class="sidebar-nav" role="tablist" aria-label="Filter tasks">
        <button type="button" class="nav-item filter-btn active" data-filter="all" role="tab" aria-selected="true">
          <span class="nav-label">All Tasks</span>
          <span class="nav-count" id="count-all">0</span>
        </button>
        <button type="button" class="nav-item filter-btn" data-filter="active" role="tab" aria-selected="false">
          <span class="nav-label">Active</span>
          <span class="nav-count" id="count-active">0</span>
        </button>
        <button type="button" class="nav-item filter-btn" data-filter="completed" role="tab" aria-selected="false">
          <span class="nav-label">Completed</span>
          <span class="nav-count" id="count-completed">0</span>
        </button>
      </nav>
    </aside>

    <!-- Main Workspace -->
    <main class="workspace">
      <div class="workspace-inner">
        <header class="workspace-header">
          <h1 class="page-title" id="page-title">All Tasks</h1>
          <div class="header-meta">
            <p class="page-subtitle" id="page-subtitle">Everything on your list.</p>
            <span class="stats-text" id="stats-counter" aria-live="polite">0 items left</span>
          </div>
        </header>

        <form id="todo-form" class="todo-form" autocomplete="off">
          <div class="input-group">
            <input
              type="text"
              id="todo-input"
              class="todo-input"
              placeholder="What needs to be done?"
              aria-label="New task description"
              maxlength="200"
              autofocus
              required
            >
            <button type="submit" id="add-btn" class="btn btn-primary" aria-label="Add task">
              <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
              </svg>
              <span>Add</span>
            </button>
          </div>
        </form>

        <section class="list-section">
          <ul id="todo-list" class="todo-list" role="list" aria-label="To-do items">
            <!-- Dynamically populated via app.js -->
          </ul>

          <!-- Empty State -->
          <div id="empty-state" class="empty-state" hidden>
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="28" height="28" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <p class="empty-title">No tasks here</p>
            <p class="empty-desc">Add a task above to get started.</p>
          </div>
        </section>

        <button type="button" id="clear-completed-btn" class="clear-btn" style="display: none;">Clear Completed</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
