<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster</title>
  <meta name="description" content="A simple, fast, accessible, and persistent to-do application.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" aria-label="Sidebar Navigation">
      <div class="sidebar-top">
        <div class="sidebar-brand">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="brand-name">TaskMaster</span>
        </div>

        <nav class="sidebar-nav" role="tablist" aria-label="Filter tasks">
          <button type="button" class="nav-item filter-btn active" data-filter="all" role="tab" id="tab-all" aria-selected="true" aria-controls="todo-list">
            <span class="nav-label">All Tasks</span>
            <span class="nav-count" id="count-all">0</span>
          </button>
          <button type="button" class="nav-item filter-btn" data-filter="active" role="tab" id="tab-active" aria-selected="false" aria-controls="todo-list">
            <span class="nav-label">Active</span>
            <span class="nav-count" id="count-active">0</span>
          </button>
          <button type="button" class="nav-item filter-btn" data-filter="completed" role="tab" id="tab-completed" aria-selected="false" aria-controls="todo-list">
            <span class="nav-label">Completed</span>
            <span class="nav-count" id="count-completed">0</span>
          </button>
        </nav>
      </div>

      <!-- Theme Switcher in Sidebar Footer -->
      <div class="sidebar-footer">
        <span class="footer-label" id="theme-label">Theme</span>
        <div class="theme-switch-group" role="radiogroup" aria-labelledby="theme-label">
          <button type="button" class="theme-btn" data-theme-val="light" role="radio" aria-checked="false" aria-label="Light mode" title="Light mode">
            <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15" aria-hidden="true">
              <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 2.78a1 1 0 011.415 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zm-2.78 4.22a1 1 0 011.414 1.415l-.707.707a1 1 0 01-1.414-1.414l.707-.707zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm-4.22-1.78a1 1 0 01-1.415 1.414l-.707-.707a1 1 0 011.414-1.414l.707.707zM4 10a1 1 0 01-1-1H2a1 1 0 110 2h1a1 1 0 01-1-1zm1.78-4.22a1 1 0 01-1.414-1.415l.707-.707a1 1 0 011.414 1.414l-.707.707zM10 6a4 4 0 100 8 4 4 0 000-8z" clip-rule="evenodd" />
            </svg>
            <span class="theme-text">Light</span>
          </button>
          <button type="button" class="theme-btn" data-theme-val="system" role="radio" aria-checked="false" aria-label="System mode" title="System mode">
            <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15" aria-hidden="true">
              <path fill-rule="evenodd" d="M3 5a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2h-2.22l.123.489.804.804A1 1 0 0113 18H7a1 1 0 01-.707-1.707l.804-.804L7.22 15H5a2 2 0 01-2-2V5zm2 0v8h10V5H5z" clip-rule="evenodd" />
            </svg>
            <span class="theme-text">Auto</span>
          </button>
          <button type="button" class="theme-btn active" data-theme-val="dark" role="radio" aria-checked="true" aria-label="Dark mode" title="Dark mode">
            <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15" aria-hidden="true">
              <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
            </svg>
            <span class="theme-text">Dark</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="workspace" id="main-content">
      <div class="workspace-inner">
        <!-- Workspace Header -->
        <header class="workspace-header">
          <h1 class="page-title" id="page-title">All Tasks</h1>
          <div class="header-meta">
            <p class="page-subtitle" id="page-subtitle">Everything on your list.</p>
            <span class="stats-text" id="stats-counter" aria-live="polite">0 items left</span>
          </div>
        </header>

        <!-- New Task Form -->
        <form id="todo-form" class="todo-form" autocomplete="off" novalidate>
          <div class="input-group">
            <label for="todo-input" class="sr-only">Task description</label>
            <input
              type="text"
              id="todo-input"
              class="todo-input"
              placeholder="What needs to be done?"
              maxlength="200"
              autofocus
              required
            >
            <button type="submit" id="add-btn" class="btn btn-primary" aria-label="Add task">
              <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor" width="16" height="16" aria-hidden="true">
                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
              </svg>
              <span>Add</span>
            </button>
          </div>
          <p id="form-error" class="form-error" hidden role="alert"></p>
        </form>

        <!-- Filter Context Hint (Used when a task is added while Completed filter is active) -->
        <div id="filter-hint" class="filter-hint" hidden role="status" aria-live="polite">
          <span id="filter-hint-message">Task created in Active tasks.</span>
          <button type="button" id="hint-action-btn" class="hint-action">Switch to Active view</button>
        </div>

        <!-- Task List Section -->
        <section class="list-section" aria-label="Task list container">
          <ul id="todo-list" class="todo-list" role="list" aria-label="Tasks">
            <!-- Dynamically populated via app.js -->
          </ul>

          <!-- Context-Aware Empty State -->
          <div id="empty-state" class="empty-state" hidden aria-live="polite">
            <div class="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="28" height="28">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <p class="empty-title" id="empty-title">No tasks yet.</p>
            <p class="empty-desc" id="empty-desc">Add your first task to get started.</p>
          </div>
        </section>

        <!-- Action Bar / Footer -->
        <div class="workspace-footer">
          <button type="button" id="clear-completed-btn" class="clear-btn" style="display: none;" aria-label="Clear all completed tasks">
            Clear Completed
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Modular JavaScript Architecture -->
  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
